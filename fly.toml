# fly.toml app configuration file generated for trace-admin on 2026-10-23T23:37:09Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#
# Trace is a Discord bot: it only makes outgoing connections, so there is no [http_service].
# Fly's launcher adds one by default, and with it Fly would health-check port 8080 and stop
# the machine for lack of web traffic.

app = 'trace-admin'
primary_region = 'iad'

[build]

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
